# Design directions for style_pick. One entry is a whole look a designer would commit to:
# palette variants, type, layout, motifs, motion, how a picture of it is made, and what to avoid.
#
# media: web, slides, image, video, document. fits: subject words (Indonesian and English) that
# make the direction more likely for a request. office_theme: the closest slides_create/doc_create
# theme. Fonts are Google Fonts (web, video, SVG); office files use office_theme.
# Add a direction by copying an entry. Keep every palette's text readable on its background.

- id: koran-pagi
  name: Koran pagi (editorial)
  media: [web, slides, document, image]
  fits: [berita, news, blog, majalah, magazine, artikel, article, opini, esai, essay, riset, research, laporan, report, jurnal]
  palettes:
    - {bg: "#F4F1EA", ink: "#141414", accent: "#C8102E", muted: "#6B6B6B"}
    - {bg: "#FFFFFF", ink: "#1B1B1B", accent: "#1F4E79", muted: "#76736E"}
  type: {heading: "Playfair Display", body: "Source Serif 4", ui: "Schibsted Grotesk"}
  layout: Asymmetric 12-column grid, a wide lead column and a narrow side column, hairline rules between sections, a drop cap on the lead paragraph.
  motifs: Column rules, small-caps kickers above headlines, folio numbers, large italic pull quotes.
  motion: Almost none. Rules draw in, text rises 8px and fades in.
  image: editorial photograph, natural window light, 35mm, muted colour grade, one strong subject off-centre
  office_theme: klasik
  avoid: Rounded cards, gradients, icon circles, centred hero text.

- id: swiss-grid
  name: Swiss grid (tipografi internasional)
  media: [web, slides, image, video, document]
  fits: [arsitektur, architecture, konsultan, consulting, agency, studio, portfolio, event, konferensi, conference, museum, data]
  palettes:
    - {bg: "#FFFFFF", ink: "#111111", accent: "#E30613", muted: "#8C8C8C"}
    - {bg: "#F2F0EB", ink: "#101820", accent: "#0057B8", muted: "#7C7F83"}
  type: {heading: "Archivo", body: "Archivo", ui: "Archivo Narrow"}
  layout: Strict modular grid, flush-left ragged-right text, huge numerals or one oversized word as the visual, lots of white space.
  motifs: Thick horizontal bars, numbered sections (01, 02), one red square, type as image.
  motion: Hard cuts and slides along the grid, 200ms, no easing flourishes. Kinetic type on a baseline.
  image: flat graphic poster, strict grid, two colours plus black, bold sans-serif typography, geometric shapes
  office_theme: grafit
  avoid: Drop shadows, decorative illustrations, more than one accent.

- id: kertas-hangat
  name: Kertas hangat (buku catatan dan kerajinan)
  media: [web, slides, image, video]
  fits: [kopi, coffee, kafe, cafe, roti, bakery, kuliner, food, umkm, kerajinan, craft, handmade, tutorial, kelas, edukasi]
  palettes:
    - {bg: "#F3EBDD", ink: "#1F2430", accent: "#E8622C", muted: "#8A8070"}
    - {bg: "#EFE6D2", ink: "#2B2118", accent: "#2F7D7A", muted: "#8B7B64"}
  type: {heading: "Bricolage Grotesque", body: "Newsreader", ui: "JetBrains Mono"}
  layout: Notebook grid paper background, content on offset "cards" with a hard ink shadow, slight rotations (under 2 degrees).
  motifs: Hand-drawn underlines, tape strips, stamps, ink outlines with 8px offset shadow.
  motion: Springy pops with slight overshoot, a slow drifting grid.
  image: warm paper texture, ink line illustration with flat fills, slight misregistration, hand-lettered labels
  office_theme: kopi
  avoid: Glass, glow, perfect symmetry, stock photos.

- id: risograph
  name: Risograph dua warna
  media: [web, image, video, slides]
  fits: [musik, music, konser, concert, gig, festival, zine, komunitas, community, seni, art, poster, acara, event, buku, book]
  palettes:
    - {bg: "#F6F1E7", ink: "#2B2A8C", accent: "#FF5C8A", muted: "#9A95C9"}
    - {bg: "#FBF4E9", ink: "#0B6E4F", accent: "#FF7F11", muted: "#9CB8A8"}
  type: {heading: "Rubik Mono One", body: "Space Mono", ui: "Space Mono"}
  layout: Overlapping shapes and type that print over each other (multiply), off-grid on purpose, big halftone areas.
  motifs: Halftone dots, grain, misregistered second colour, overprint where two inks meet.
  motion: Stepped at 12fps, colour layers slip apart and snap back.
  image: risograph print, two spot inks (blue and fluorescent pink), halftone dots, grain, slight misregistration
  office_theme: lavender
  avoid: Smooth gradients, photoreal 3D, more than two inks.

- id: brutalist-mono
  name: Brutalist monospace
  media: [web, slides, video]
  fits: [developer, dev, api, open source, startup, tool, cli, hacker, teknologi, tech, portfolio, coding, software]
  palettes:
    - {bg: "#FFFFFF", ink: "#000000", accent: "#0000FF", muted: "#5E5E5E"}
    - {bg: "#E8E8E3", ink: "#111111", accent: "#FF3B00", muted: "#6D6D66"}
  type: {heading: "IBM Plex Mono", body: "IBM Plex Mono", ui: "IBM Plex Mono"}
  layout: Raw document flow, visible borders (2px solid), tables as layout, underlined links, no rounded corners at all.
  motifs: ASCII dividers, bracketed labels [like this], blinking cursor, timestamps.
  motion: Instant state changes, a typewriter reveal, cursor blink.
  image: monochrome screen print of terminal text, hard pixels, high contrast
  office_theme: grafit
  avoid: Gradients, soft shadows, illustrations, pastel.

