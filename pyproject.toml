[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".venv_ruff",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "*.bak",
    "*.corrupt",
    # Vendored skill code, kept as upstream wrote it.
    "brain/skills/*/tools",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Short aliases are an intentional convention in the vault package and its tests
# (C=constants, F=frontmatter, G=graph, V=vault).
"tool/execute/execute_local_memory/**" = ["N812"]
"agent/harness/**" = ["N812"]
"agent/session_stack.py" = ["N812"]
"tests/test_vault_memory.py" = ["N812"]

[tool.pytest.ini_options]
# Without this section pytest walks up to the parent folder and uses
# that project's config, where pythonpath=["."] resolves `tool` to the WRONG
# package (the parent's tool/, which has no execute_local_memory). Every test
# then dies with ModuleNotFoundError before it runs.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
markers = [
    "live: hits the real API (deselect with '-m \"not live\"')",
    "slow: slow test",
]

[tool.mypy]
python_version = "3.12"
files = [
    "agent",
    "brain",
    "config",
    "model",
    "security",
    "tool",
    "utils",
    "web",
    "main.py",
]
ignore_missing_imports = true
explicit_package_bases = true
show_error_codes = true
pretty = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
