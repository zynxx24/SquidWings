<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Agent</title>
<script src="/static/js/tailwind.js"></script>
<link rel="stylesheet" href="/static/css/highlight.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-screen bg-stone-50 text-stone-900 font-sans text-sm antialiased overflow-hidden">

<div id="app" class="h-full flex flex-col">

  <header class="h-12 shrink-0 border-b border-stone-200 bg-white flex items-center gap-3 px-3 sm:px-4">
    <span class="font-semibold tracking-tight shrink-0">Agent</span>
    <nav class="flex gap-1 overflow-x-auto">
      <button data-tab="chat" class="tab px-3 py-1.5 rounded-md whitespace-nowrap">Chat</button>
      <button data-tab="canvas" data-feature="teams" class="tab px-3 py-1.5 rounded-md whitespace-nowrap">Team canvas</button>
    </nav>
    <div class="ml-auto flex items-center gap-2 min-w-0">
      <select id="model-select" class="min-w-0 w-28 sm:w-56 lg:w-72 truncate border border-stone-300 rounded-md bg-white px-2 py-1.5 focus:outline-none focus:border-stone-500"></select>
      <button id="refresh-models" title="Fetch models again" class="hidden sm:inline-flex border border-stone-300 rounded-md px-2.5 py-1.5 hover:bg-stone-100 shrink-0">Refresh</button>
    </div>
  </header>

  <main id="view-chat" class="view flex-1 min-h-0 flex">
    <aside id="session-panel" class="session-panel flex w-60 shrink-0 flex-col border-r border-stone-200 bg-white">
      <div class="p-3 flex items-center justify-between gap-2 border-b border-stone-200">
        <span class="font-medium">Chats</span>
        <div class="flex gap-1">
          <button id="new-chat" class="border border-stone-300 rounded-md px-2 py-1 hover:bg-stone-100">New</button>
          <button id="close-sessions" class="lg:hidden border border-stone-300 rounded-md px-2 py-1 hover:bg-stone-100">Close</button>
        </div>
      </div>
      <div id="session-list" class="flex-1 min-h-0 overflow-y-auto p-2 space-y-1"></div>
    </aside>

    <section class="flex-1 min-w-0 min-h-0 flex flex-col">
      <div class="shrink-0 h-10 border-b border-stone-200 bg-white flex items-center gap-2 px-3 sm:px-4">
        <button id="open-sessions" class="lg:hidden border border-stone-300 rounded-md px-2 py-1 hover:bg-stone-100 shrink-0">Chats</button>
        <span id="chat-title" class="text-xs text-stone-500 truncate">New chat</span>
      </div>

      <div id="messages" class="flex-1 min-h-0 overflow-y-auto overscroll-contain">
        <div id="empty" class="h-full flex items-center justify-center px-6 text-center text-stone-400">Pick a model and start typing.</div>
        <div id="thread" class="w-full max-w-3xl mx-auto px-3 sm:px-4 py-4 sm:py-5 space-y-4"></div>
      </div>

      <div class="shrink-0 border-t border-stone-200 bg-white pb-[env(safe-area-inset-bottom)]">
        <div class="w-full max-w-3xl mx-auto px-3 sm:px-4 py-2 sm:py-3">
          <div id="chips" class="flex flex-wrap gap-2 mb-2 empty:hidden"></div>
          <div class="flex items-end gap-1.5 sm:gap-2">
            <label class="border border-stone-300 rounded-md px-2.5 sm:px-3 py-2 cursor-pointer hover:bg-stone-100 shrink-0" title="Attach a document">
              <span class="hidden sm:inline">Attach</span>
              <span class="sm:hidden" aria-hidden="true">+</span>
              <input id="file-input" type="file" multiple accept=".pdf,.docx,.pptx,.xlsx,.csv,.json,.txt,.md,.png,.jpg,.jpeg,.webp,.gif" class="hidden">
            </label>
            <textarea id="input" rows="1" placeholder="Message" class="flex-1 min-w-0 resize-none border border-stone-300 rounded-md px-3 py-2 max-h-40 focus:outline-none focus:border-stone-500"></textarea>
            <button id="send" class="bg-stone-900 text-white rounded-md px-3 sm:px-4 py-2 hover:bg-stone-700 disabled:opacity-40 shrink-0">Send</button>
          </div>
          <div id="upload-hint" class="mt-1.5 text-xs text-stone-400 line-clamp-2"></div>
        </div>
      </div>
    </section>
  </main>

  <main id="view-canvas" class="view hidden flex-1 min-h-0 flex">
    <aside id="team-panel" class="team-panel flex w-60 shrink-0 flex-col border-r border-stone-200 bg-white">
      <div class="p-3 flex items-center justify-between gap-2 border-b border-stone-200">
        <span class="font-medium">Teams</span>
        <div class="flex gap-1">
          <button id="new-team" class="border border-stone-300 rounded-md px-2 py-1 hover:bg-stone-100">New</button>
          <button id="close-teams" class="lg:hidden border border-stone-300 rounded-md px-2 py-1 hover:bg-stone-100">Close</button>
        </div>
      </div>
      <div id="team-list" class="flex-1 min-h-0 overflow-y-auto p-2 space-y-1"></div>
    </aside>

    <section class="flex-1 min-w-0 flex flex-col">
      <div class="shrink-0 h-12 border-b border-stone-200 bg-white flex items-center gap-2 px-2 sm:px-3 overflow-x-auto">
        <button id="open-teams" class="lg:hidden border border-stone-300 rounded-md px-2 py-1.5 hover:bg-stone-100 shrink-0">Teams</button>
        <input id="team-name" placeholder="Team name" class="border border-stone-300 rounded-md px-2 py-1.5 w-32 sm:w-52 focus:outline-none focus:border-stone-500 shrink-0">
        <button id="add-node" class="border border-stone-300 rounded-md px-2.5 py-1.5 hover:bg-stone-100 shrink-0">Add agent</button>
        <button id="save-team" class="border border-stone-300 rounded-md px-2.5 py-1.5 hover:bg-stone-100 shrink-0">Save</button>
        <button id="delete-team" class="border border-stone-300 rounded-md px-2.5 py-1.5 text-red-700 hover:bg-red-50 shrink-0">Delete</button>
        <span id="canvas-msg" class="text-xs text-stone-500 whitespace-nowrap"></span>
      </div>

      <div class="flex-1 min-h-0 flex">
        <div id="board" class="relative flex-1 min-w-0 overflow-auto overscroll-contain bg-stone-50 canvas-grid">
          <svg id="edges" class="absolute inset-0 pointer-events-none" width="2400" height="1600"></svg>
          <div id="nodes" class="absolute inset-0" style="width:2400px;height:1600px"></div>
        </div>

        <aside id="inspector-panel" class="inspector-panel w-72 shrink-0 border-l border-stone-200 bg-white overflow-y-auto">
          <div class="lg:hidden flex items-center justify-between border-b border-stone-200 p-2">
            <span class="font-medium">Agent</span>
            <button id="close-inspector" class="border border-stone-300 rounded-md px-2 py-1 hover:bg-stone-100">Done</button>
          </div>
          <div id="inspector" class="p-4 space-y-3 text-stone-400">Select an agent on the canvas.</div>
        </aside>
      </div>

      <div class="shrink-0 border-t border-stone-200 bg-white pb-[env(safe-area-inset-bottom)]">
        <div class="flex gap-2 p-2 sm:p-3">
          <input id="task" placeholder="Task for the team" class="flex-1 min-w-0 border border-stone-300 rounded-md px-3 py-2 focus:outline-none focus:border-stone-500">
          <button id="run" class="bg-stone-900 text-white rounded-md px-3 sm:px-4 py-2 hover:bg-stone-700 disabled:opacity-40 shrink-0">Run</button>
          <button id="cancel" class="hidden border border-stone-300 rounded-md px-3 sm:px-4 py-2 hover:bg-stone-100 shrink-0">Cancel</button>
        </div>
        <div id="run-info" class="px-3 pb-2 text-xs text-stone-500"></div>
        <div id="result" class="hidden prose-out max-h-64 overflow-y-auto border-t border-stone-200 px-3 sm:px-4 py-3"></div>
      </div>
    </section>
  </main>
</div>

<div id="scrim" class="scrim hidden"></div>
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 max-w-[90vw] bg-stone-900 text-white rounded-md px-4 py-2 shadow z-50"></div>

<script src="/static/js/marked.min.js"></script>
<script src="/static/js/highlight.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
