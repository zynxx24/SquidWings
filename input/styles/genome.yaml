# Design genome: the parts style_pick combines into a new direction every time.
#
# A direction is one personality (the brief), then one choice from each axis below: a font pair,
# a layout for the medium, a shape language, a motif, an image treatment, a motion style and a
# density. The palette is generated (see design_genome.py), not listed. An option whose `tags`
# share a word with the personality's `tags` is much more likely; any other can still come up
# now and then, which is where the surprises come from.
#
# Everything here is plain data: add a font pair, a layout or a motif and it joins the mix.
# Fonts are Google Fonts. `weights` are the ones the family really has (a request for a weight
# it lacks makes Google refuse the whole CSS link).

