layouts:
  web:
    - {id: split-hero, name: Split hero, tags: [structured, minimal, trust], recipe: "The first screen splits 5/7: the claim and one action on one side, the product or a real photo on the other. Below, sections alternate sides so the eye zigzags."}
    - {id: editorial-column, name: Editorial column, tags: [editorial, calm, serif], recipe: "One reading column of 65 characters with a wide margin for notes, figures and pull quotes that break out into it. Headlines left-aligned, no hero box."}
    - {id: index-list, name: Index list, tags: [minimal, structured, precise], recipe: "The page is a numbered list: each row a title, a one-line summary and a meta column (date, price, place). Hover opens a detail; no cards at all."}
    - {id: poster-type, name: Poster type, tags: [bold, poster, loud, display], recipe: "One oversized word or number fills the first screen edge to edge; everything else is small and tucked into the corners like a poster's fine print."}
    - {id: asymmetric-grid, name: Asymmetric grid, tags: [structured, editorial, bold], recipe: "A 12-column grid used unevenly: big blocks of 7, 4 or 9 columns, some content hanging into the gutter, one element breaking the grid on purpose per section."}
    - {id: bento-hierarchy, name: Bento with a hierarchy, tags: [tech, pop, structured], recipe: "A tile grid where tiles differ in size by importance: one large lead tile, two medium, several small. No two neighbours the same size; real content in each, not icons."}
    - {id: magazine-spread, name: Magazine spread, tags: [editorial, luxury, elegant], recipe: "Sections read like spreads: a full-bleed image page next to a text page, captions set small beside images, a running header with the section name."}
    - {id: chapter-scroll, name: Numbered chapters, tags: [editorial, structured, calm], recipe: "A long scroll in numbered chapters (01, 02, 03) with a sticky chapter index on the side; each chapter opens with a big numeral and a one-line thesis."}
    - {id: catalog-grid, name: Catalog grid, tags: [craft, warm, pop], recipe: "A shop-window grid of real items with photo, name and price in a strict rhythm; filters as plain text links above; one featured item breaks the grid at double size."}
    - {id: timeline-rail, name: Timeline rail, tags: [structured, trust, editorial], recipe: "A vertical rail runs down the page; events, steps or milestones hang off it alternately left and right, dates set large in the accent colour."}
    - {id: dashboard-rail, name: Dashboard rail, tags: [tech, precise, dark], recipe: "A narrow left rail for navigation, a top strip of three key numbers with sparklines, then one main chart and a dense table; no decorative cards."}
    - {id: letter, name: A letter, tags: [warm, handmade, calm, craft], recipe: "The page reads like a personal letter or menu: centred narrow column on a paper texture, a handwritten-style signature, small ornaments between parts."}
    - {id: horizontal-strip, name: Horizontal strip, tags: [pop, youthful, playful], recipe: "One section scrolls sideways through a strip of large panels (works, products, steps) while the rest of the page scrolls normally; arrows and a counter show position."}
    - {id: sticker-collage, name: Sticker collage, tags: [playful, youthful, handmade, pop], recipe: "Content blocks sit like stickers and cut paper: slightly rotated, overlapping, with tape or outlines; the text inside stays straight and readable."}
    - {id: product-sheet, name: Product sheet, tags: [minimal, precise, tech], recipe: "A spec-sheet page: a large product view, then a two-column table of facts with hairline rules, callout lines pointing at parts of the product."}
    - {id: big-numbers, name: Big numbers, tags: [bold, structured, trust], recipe: "Every section leads with one large number (a price, a year, a count) set huge in the heading font, with the explanation set small beside it."}
    - {id: card-stack, name: Stacked panels, tags: [modern, pop, minimal], recipe: "Full-width panels stack as you scroll, each a different background tint from the palette, each with one message and one image; the stack edge peeks at the bottom."}
    - {id: map-led, name: Map led, tags: [earthy, natural, trust], recipe: "A map or floor plan is the main image; locations are numbered on it and listed beside with address and hours; directions as the main action."}
    - {id: quote-wall, name: Quote wall, tags: [calm, elegant, editorial], recipe: "Large quotations in the heading font form the rhythm of the page, each attributed to a real named source, with the body content between them."}
    - {id: terminal-doc, name: Docs layout, tags: [tech, mono, precise], recipe: "A documentation shape: left table of contents, centred content with code blocks and callouts, right column 'on this page' links."}
    - {id: menu-board, name: Menu board, tags: [warm, retro, craft], recipe: "Items listed like a menu board: name, dotted leader, price; grouped under hand-lettered category headings; specials boxed."}
    - {id: hero-video-free, name: Type over photo, tags: [luxury, earthy, calm], recipe: "One full-bleed real photograph with the headline set over its quiet area; everything below is text-led with generous spacing and thin dividers."}
  # Apps, dashboards, admin panels, school and shop systems. Each has a skeleton: the grid the screen is built on.
  app:
    - {id: rail-workspace, name: Rail and workspace, tags: [structured, precise, tech, minimal], fits: [admin, sistem, manajemen, erp, inventaris, inventory, gudang], recipe: "A 64px icon rail on the far left, a 220px labelled section list beside it that can collapse, and the workspace with a sticky toolbar (title, filters, the one main action at the right).", skeleton: "body{display:grid;grid-template-columns:64px 220px 1fr;grid-template-rows:56px 1fr;grid-template-areas:'rail nav bar' 'rail nav main'}"}
    - {id: command-bar, name: Command bar, tags: [minimal, tech, precise, calm], fits: [pencarian, search, katalog, dokumentasi, notes, catatan], recipe: "No sidebar. A top bar with a wide search and command field (Ctrl+K), page tabs under it, then the content full width with filters as a row of chips.", skeleton: "body{display:grid;grid-template-rows:56px 44px 1fr;grid-template-areas:'bar' 'tabs' 'main'} main{max-width:1280px;margin-inline:auto}"}
    - {id: master-detail, name: List and detail, tags: [structured, calm, trust, readable], fits: [siswa, pegawai, karyawan, pelanggan, kontak, pasien, anggota, member], recipe: "A 360px list on the left (search on top, each row name + one status), the selected record on the right with its actions in a sticky header. On a phone the list and the detail are two screens.", skeleton: "main{display:grid;grid-template-columns:360px 1fr;height:100dvh} .list{overflow:auto;border-right:1px solid var(--line)}"}
    - {id: three-pane, name: Three panes, tags: [structured, precise, tech], fits: [pesan, inbox, tiket, ticket, email, chat, laporan masuk], recipe: "Folders or groups, the list, and a preview side by side like a mail client; the preview pane shows the full record and its history.", skeleton: "main{display:grid;grid-template-columns:200px 340px 1fr;height:100dvh}"}
    - {id: kanban, name: Board by status, tags: [friendly, pop, structured, youthful], fits: [tugas, task, pesanan, order, tiket, proyek, project, produksi], recipe: "Columns by status (Baru, Diproses, Selesai...) that scroll sideways, cards with the few facts that matter and a count on each column header; drag to move.", skeleton: "main{display:grid;grid-auto-flow:column;grid-auto-columns:300px;gap:16px;overflow-x:auto;align-items:start}"}
    - {id: table-first, name: Table first, tags: [precise, structured, minimal, trust], fits: [data, rekap, stok, stock, transaksi, keuangan, nilai, inventaris, laporan], recipe: "The screen is one dense table with a sticky header, filter chips above, a bulk-action bar that appears on selection, and a side drawer for a row's detail instead of a new page.", skeleton: "main{display:grid;grid-template-rows:auto auto 1fr} table{border-collapse:collapse;font-variant-numeric:tabular-nums} thead{position:sticky;top:0}"}
    - {id: wizard-steps, name: Steps with a summary, tags: [trust, calm, friendly, readable], fits: [pendaftaran, registrasi, daftar, ppdb, onboarding, formulir, pengajuan, checkout], recipe: "A vertical stepper on the left (done, now, next), one step's form in the centre, and a summary of what was filled on the right that stays in view.", skeleton: "main{display:grid;grid-template-columns:240px minmax(0,640px) 300px;gap:32px;justify-content:center}"}
    - {id: ledger-kpis, name: Ledger and feed, tags: [precise, editorial, structured, classic], fits: [dashboard, statistik, penjualan, keuangan, monitoring, analitik, analytics], recipe: "Numbers first as a ledger line (label small above, value large, change beside it), then one wide chart and an activity feed side by side. No icon-in-a-circle stat cards.", skeleton: "main{display:grid;grid-template-columns:2fr 1fr;grid-template-areas:'kpi kpi' 'chart feed';gap:24px} .kpi{display:flex;gap:48px;border-block:1px solid var(--line)}"}
    - {id: agenda-week, name: Week and agenda, tags: [calm, structured, friendly], fits: [jadwal, kalender, booking, reservasi, kelas, shift, janji, appointment], recipe: "A week grid (days as columns, hours as rows) as the main view, today's agenda as a list on the side, and the date switcher in the top bar.", skeleton: "main{display:grid;grid-template-columns:1fr 320px} .week{display:grid;grid-template-columns:56px repeat(7,1fr)}"}
    - {id: photo-roster, name: Photo roster, tags: [friendly, warm, humanist, youthful], fits: [siswa, foto, galeri, produk, menu, katalog, absensi], recipe: "People or items as a grid of photo cards (face or product first, name and one status under it), a filter row on top, and a quick-view sheet that slides up instead of a new page.", skeleton: "main{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}"}
    - {id: form-preview, name: Form and live preview, tags: [trust, editorial, classic, readable], fits: [surat, cetak, print, sertifikat, kwitansi, invoice, kartu, struk, undangan], recipe: "The form on the left, the document it makes (a letter, a card, a receipt, a print page) on the right, updating as you type, with print and download on the preview.", skeleton: "main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px} .preview{position:sticky;top:24px}"}
    - {id: activity-timeline, name: Timeline and context, tags: [editorial, calm, structured], fits: [riwayat, log, aktivitas, tracking, pengiriman, status, audit], recipe: "A vertical timeline of events down the middle (time on the left of the line, the event on the right), and a side panel with the context of the selected event.", skeleton: "main{display:grid;grid-template-columns:1fr 340px;gap:32px} .timeline{border-left:2px solid var(--line)}"}
    - {id: phone-tabs, name: Phone first with tabs, tags: [friendly, rounded, soft, youthful], fits: [mobile, hp, android, absensi, kasir, pos, presensi], recipe: "Built for a phone held in one hand: a bottom tab bar, the main action as a large button within thumb reach, one column of cards; on desktop the tabs move to a top bar and cards become two columns.", skeleton: "body{display:grid;grid-template-rows:1fr 64px;min-height:100dvh} nav.tabs{position:sticky;bottom:0} @media(min-width:900px){body{grid-template-rows:56px 1fr}}"}
    - {id: focus-task, name: One task in focus, tags: [minimal, calm, soft], fits: [kamera, camera, scan, selfie, foto, absensi, presensi, ujian, kuis], recipe: "One task fills the screen (a camera, a scanner, a single question) with a thin progress line on top and only the next and back actions; everything else waits behind a menu.", skeleton: "main{display:grid;place-items:center;min-height:100dvh;grid-template-rows:4px 1fr auto}"}
  slides:
    - {id: big-statement, name: Big statement, tags: [bold, poster, loud], recipe: "Most slides carry one sentence set huge; facts go on small follow-up slides; section breaks on full accent colour."}
    - {id: editorial-deck, name: Editorial deck, tags: [editorial, serif, calm], recipe: "Two-column slides like a magazine page: text column and image column, captions small, slide numbers as folios."}
    - {id: number-led, name: Number led, tags: [structured, trust, bold], recipe: "Each content slide leads with one large figure and a short line explaining it; comparisons as two big numbers side by side."}
    - {id: grid-deck, name: Swiss grid deck, tags: [minimal, structured, precise], recipe: "A strict 6-column grid on every slide, flush-left text, one image block, numbered sections in the corner."}
    - {id: photo-deck, name: Photo deck, tags: [luxury, earthy, calm], recipe: "Full-bleed photographs with a text band; data slides on the plain background; no clip-art."}
    - {id: chapter-deck, name: Chapter deck, tags: [editorial, structured], recipe: "Numbered chapters with divider slides; a running chapter label at the top of every slide."}
    - {id: diagram-deck, name: Diagram deck, tags: [tech, precise], recipe: "Explains with drawn diagrams and flows built from shapes in the palette; one idea per diagram; minimal text."}
    - {id: sticker-deck, name: Sticker deck, tags: [playful, youthful, pop], recipe: "Tilted labels, cut-paper shapes and hand-drawn arrows around straight readable text; a different background tint per section."}
    - {id: quote-deck, name: Quote and evidence, tags: [calm, elegant, trust], recipe: "Alternates a large quotation or claim with an evidence slide (chart, table, source)."}
    - {id: timeline-deck, name: Timeline deck, tags: [structured, trust], recipe: "A horizontal timeline runs across the deck; each slide zooms into one point on it."}
  image:
    - {id: monumental-type, name: Monumental type, tags: [bold, poster, loud], recipe: "One word or number fills most of the frame; the subject sits small against it; fine print in a corner."}
    - {id: off-centre-subject, name: Off-centre subject, tags: [calm, editorial, earthy], recipe: "The subject on a third line with open space for the text; horizon or edge lines lead to it."}
    - {id: grid-of-things, name: Grid of things, tags: [structured, craft, pop], recipe: "Objects laid out in a neat grid seen from above (flat lay); one odd item breaks the pattern."}
    - {id: diagonal-cut, name: Diagonal cut, tags: [bold, youthful, pop], recipe: "The frame splits along a diagonal into two colour fields; text runs along the cut."}
    - {id: collage, name: Paper collage, tags: [handmade, playful, retro], recipe: "Cut-out photo pieces, torn paper edges, tape and stamps layered with depth; one clear focal piece."}
    - {id: frame-in-frame, name: Frame in frame, tags: [elegant, luxury, classic], recipe: "A thin border inset from the edges, the subject framed inside, title set across the frame line."}
    - {id: halftone-portrait, name: Halftone duotone, tags: [retro, bold, poster], recipe: "The subject as a two-colour halftone image in the palette, big type overlapping the image."}
