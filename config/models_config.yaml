# ============================================
# Agent Router — Model Capabilities Configuration
# ============================================
# Auto-generated from /v1/models API endpoint (ag/, kg/ and vk/ providers)
# Last synchronized: 2026-10-22
#
# Router Strategy:
#   - DEFAULT (semua task) → Gemini 3.8 Flash (cepat, murah, multimodal)
#   - ACTIVITY MEDIUM      → Claude Sonnet 4.6 (balance quality/speed)
#   - ACTIVITY HARD         → Claude Opus 4.6 Thinking (deep reasoning)

# ============================================
# MODEL DEFINITIONS
# ============================================
routing:
  # --- Code Tasks ---
  code:
    easy: "ag/gemini-3.8-flash-high"
    medium: "ag/claude-sonnet-4-6"
    hard: "ag/claude-opus-4-6-thinking"
    fallback_chain:
      - "ag/gemini-3.8-flash-high"
      - "gemini/gemini-3.8-flash"
      - "kg/gemini-3-8-flash"
      - "ag/claude-sonnet-4-6"
      - "kg/deepseek-v4-pro"
      - "kg/qwen3.8-max"
      - "kg/kimi-k2-7-code"
      - "ag/claude-opus-4-6-thinking"
      - "kg/claude-haiku-5-5"
      - "vk/anthropic/claude-sonnet-4.6"
      - "vk/openai/gpt-6-sol"
      - "vk/deepseek/deepseek-v4-pro"
    default_difficulty: medium
    temperature: 0.2
    enable_thinking: true
    enable_tools: true

  # --- Math Tasks ---
  math:
    easy: "ag/gemini-3.8-flash-high"
    medium: "ag/claude-sonnet-4-6"
    hard: "ag/claude-opus-4-6-thinking"
    fallback_chain:
      - "ag/gemini-3.8-flash-high"
      - "gemini/gemini-3.8-flash"
      - "kg/deepseek-v4-pro"
      - "ag/claude-sonnet-4-6"
      - "kg/qwen3.8-max"
      - "ag/claude-opus-4-6-thinking"
      - "vk/deepseek/deepseek-v4-pro"
      - "vk/openai/gpt-6-astra"
    default_difficulty: medium
    temperature: 0.1
    enable_thinking: true
    enable_tools: false

  # --- Activity (General) Tasks ---
  activity:
    easy: "ag/gemini-3.8-flash-high"
    medium: "ag/claude-sonnet-4-6"
    hard: "ag/claude-opus-4-6-thinking"
    fallback_chain:
      - "ag/gemini-3.8-flash-high"
      - "gemini/gemini-3.8-flash"
      - "kg/gemini-3-8-flash"
      - "ag/claude-sonnet-4-6"
      - "kg/gpt-5-6-luna"
      - "ag/claude-opus-4-6-thinking"
      - "kg/claude-sonnet-4-6"
      - "vk/openai/gpt-6-luna"
      - "vk/gemini/gemini-3.8-flash"
    default_difficulty: easy
    temperature: 0.7
    enable_thinking: false
    enable_tools: false

  # --- School Tasks ---
  school_task:
    easy: "ag/gemini-3.8-flash-high"
    medium: "ag/claude-sonnet-4-6"
    hard: "ag/claude-opus-4-6-thinking"
    fallback_chain:
      - "ag/gemini-3.8-flash-high"
      - "gemini/gemini-3.8-flash"
      - "kg/gemini-3-8-flash"
      - "ag/claude-sonnet-4-6"
      - "kg/deepseek-v4-pro"
      - "ag/claude-opus-4-6-thinking"
      - "vk/anthropic/claude-sonnet-5.5"
      - "vk/deepseek/deepseek-v4.1-flash"
    default_difficulty: medium
    temperature: 0.3
    enable_thinking: true
    enable_tools: false

  # --- Image Generation Tasks ---
  generate_img:
    easy: "ag/gemini-3.8-flash-high"
    medium: "ag/claude-sonnet-4-6"
    hard: "ag/claude-opus-4-6-thinking"
    fallback_chain:
      - "ag/gemini-3.8-flash-high"
      - "kg/gpt-5-6-luna"
      - "gemini/gemini-4-argon"
      - "ag/claude-sonnet-4-6"
      - "vk/openai/gpt-6-luna"
      - "vk/gemini/gemini-3.8-flash"
    default_difficulty: easy
    temperature: 0.8
    enable_thinking: false
    enable_tools: true

  # --- Reasoning Tasks ---
  reason:
    easy: "ag/gemini-3.8-flash-high"
    medium: "ag/claude-sonnet-4-6"
    hard: "ag/claude-opus-4-6-thinking"
    fallback_chain:
      - "ag/claude-opus-4-6-thinking"
      - "kg/claude-sonnet-4-6"
      - "kg/qwen3.8-max"
      - "kg/deepseek-v4-pro"
      - "ag/claude-sonnet-4-6"
      - "gemini/gemini-4-argon"
      - "ag/gemini-3.8-flash-high"
      - "gemini/gemini-3.8-flash"
      - "vk/anthropic/claude-opus-5.5"
      - "vk/deepseek/deepseek-v4-pro"
    default_difficulty: hard
    temperature: 0.1
    enable_thinking: true
    enable_tools: false

  # --- Multimodal Tasks ---
  multimodal:
    easy: "ag/gemini-3.8-flash-high"
    medium: "ag/claude-sonnet-4-6"
    hard: "ag/claude-opus-4-6-thinking"
    fallback_chain:
      - "ag/gemini-3.8-flash-high"
      - "gemini/gemini-3.8-flash"
      - "gemini/gemini-4-argon"
      - "kg/gemini-3-8-flash"
      - "kg/mimo-v2.6-flash"
      - "kg/claude-sonnet-4-6"
      - "kg/gpt-5-6-luna"
      - "ag/claude-sonnet-4-6"
      - "vk/gemini/gemini-3.7-flash-high"
      - "vk/openai/gpt-6-astra"
    default_difficulty: easy
    temperature: 0.5
    enable_thinking: true
    enable_tools: true

# ============================================
# DEFAULT MODEL
# ============================================
default_model: "ag/gemini-3.8-flash-high"

# ============================================
# TOKEN LIMITS PER TASK TYPE
# ============================================
token_limits:
  code:
    min_output: 100
    default_max_output: 16384
  math:
    min_output: 50
    default_max_output: 4096
  activity:
    min_output: 20
    default_max_output: 8192
  school_task:
    min_output: 100
    default_max_output: 16384
  generate_img:
    min_output: 10
    default_max_output: 4096
  reason:
    min_output: 200
    default_max_output: 32768
  multimodal:
    min_output: 20
    default_max_output: 8192

# ============================================
# THINKING FORMAT HANDLERS
# ============================================
# Maps thinking_format → parser class to use
thinking_handlers:
  gemini-level: "model.parser.gemini_parser.GeminiParser"
  claude-adaptive: "model.parser.claude_parser.ClaudeAdaptiveParser"
  claude-budget: "model.parser.claude_parser.ClaudeBudgetParser"
  openai: "model.parser.openai_parser.OpenAIParser"
  deepseek: "model.parser.deepseek_parser.DeepSeekParser"

# ============================================
# BANSOS MODE — Free API via Kagiro
# ============================================
# Model khusus untuk mode bansos (gratis, unlimited fallback)
# API: https://api.kagiro.net/v1
# Konfigurasi API key & base URL di file .env
bansos:
  model: "deepseek-v4.1-flash-1017"
  display_name: "DeepSeek V4.1 Flash 1017 (Bansos)"
  provider: bansos
  thinking_format: deepseek
  context_window: 1000000
  max_output: 128000
  temperature: 0.3
  enable_tools: true
  enable_auto_generate: true
  max_tool_retries: unlimited
  fallback_chain:
    - "deepseek-v4.1-flash-1017"

