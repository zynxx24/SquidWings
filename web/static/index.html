<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121413" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<title>SquidWings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d7a6f'/%3E%3Cpath d='M16 6c-4 0-7 3-7 7 0 3 2 5 3 6l-3 7m7-20c4 0 7 3 7 7 0 3-2 5-3 6l3 7m-7-13v13' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/highlight.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div id="shell" class="shell">

  <aside id="rail" class="rail" aria-label="Daftar chat">
    <div class="rail-head">
      <div class="brand"><span class="brand-mark" aria-hidden="true">S</span><span>SquidWings</span></div>
      <button id="close-rail" class="icon-btn" aria-label="Tutup daftar chat" data-icon="x"></button>
    </div>
    <button id="new-chat" class="btn btn-primary btn-block"><span data-icon="plus"></span>Chat baru</button>
    <label class="search">
      <span data-icon="search"></span>
      <input id="session-search" type="search" placeholder="Cari chat" aria-label="Cari chat">
    </label>
    <nav id="session-list" class="session-list" aria-label="Riwayat chat"></nav>
    <div class="rail-foot">
      <button id="nav-team" class="rail-link hidden"><span data-icon="team"></span>Tim agent</button>
      <button id="toggle-theme" class="rail-link"><span data-icon="theme"></span><span id="theme-label">Tema</span></button>
    </div>
  </aside>

  <main class="stage">
    <header id="topbar" class="topbar">
      <button id="open-rail" class="icon-btn" aria-label="Tampilkan atau sembunyikan daftar chat" data-icon="menu"></button>
      <h1 id="chat-title" class="chat-title">Chat baru</h1>
      <div class="topbar-actions">
        <button id="nav-chat" class="btn btn-ghost hidden"><span data-icon="chat"></span>Kembali ke chat</button>
        <button id="open-inspector" class="btn btn-ghost" aria-controls="inspector"><span data-icon="layers"></span><span class="hide-small">Sesi ini</span></button>
      </div>
    </header>

    <section id="view-chat" class="view is-empty">
      <div id="scroller" class="scroller">
        <div id="thread" class="thread"></div>
      </div>
      <button id="to-bottom" class="to-bottom hidden" aria-label="Ke pesan terbaru" data-icon="down"></button>

      <div class="dock">
        <div class="hero">
          <h2>Mau kerjakan apa?</h2>
          <p>Setiap chat punya folder, vault, graph kode, dan memorinya sendiri.</p>
        </div>
        <form id="composer" class="composer">
          <div id="chips" class="chips"></div>
          <textarea id="input" rows="1" placeholder="Tulis tugas atau pertanyaan" aria-label="Pesan"></textarea>
          <div class="composer-row">
            <label class="icon-btn" title="Lampirkan file" aria-label="Lampirkan file">
              <span data-icon="clip"></span>
              <input id="file-input" type="file" multiple class="visually-hidden">
            </label>
            <select id="model-select" class="model-select" aria-label="Model"></select>
            <span class="composer-hint hide-small">Enter kirim · Shift+Enter baris baru</span>
            <button id="send" type="submit" class="send" aria-label="Kirim" data-icon="send"></button>
          </div>
        </form>
        <div class="suggestions">
          <button class="suggestion" data-prompt="Buat REST API sederhana untuk daftar tugas dengan FastAPI, lengkap dengan tes, lalu jalankan tesnya.">Bangun REST API</button>
          <button class="suggestion" data-prompt="Buat landing page responsif untuk kedai kopi, satu file HTML, tanpa library.">Buat landing page</button>
          <button class="suggestion" data-prompt="Tes saya gagal. Saya akan tempel errornya, bantu temukan penyebab dan perbaiki.">Perbaiki bug</button>
          <button class="suggestion" data-prompt="Riset berita terbaru tentang Python, rangkum poin pentingnya beserta sumber.">Riset di web</button>
        </div>
      </div>
    </section>

    <section id="view-team" class="view hidden">
      <div class="team-bar">
        <div class="team-bar-group">
          <select id="team-select" aria-label="Pilih tim"></select>
          <select id="template-select" aria-label="Mulai dari template"><option value="">Template</option></select>
          <input id="team-name" placeholder="Nama tim" aria-label="Nama tim">
        </div>
        <div class="team-bar-group">
          <select id="add-node" aria-label="Tambah node">
            <option value="">+ Tambah</option>
            <option value="agent">Agent</option>
            <optgroup label="Logika">
              <option value="gate">Gate IF (AND/OR)</option>
              <option value="switch">Switch</option>
              <option value="merge">Merge</option>
              <option value="delay">Delay</option>
            </optgroup>
            <optgroup label="Data">
              <option value="set">Teks / template</option>
              <option value="http">HTTP request</option>
            </optgroup>
            <optgroup label="Keluaran">
              <option value="telegram">Telegram</option>
              <option value="database">Database</option>
            </optgroup>
          </select>
          <button id="flow-schedule" class="btn btn-ghost" type="button">Jadwal</button>
          <button id="tidy-board" class="btn btn-ghost" type="button">Rapikan</button>
          <button id="save-team" class="btn btn-ghost">Simpan</button>
          <button id="delete-team" class="icon-btn btn-danger" aria-label="Hapus tim" title="Hapus tim" data-icon="trash"></button>
        </div>
      </div>
      <div class="team-body">
        <div id="board" class="board">
          <svg id="edges" class="edges" width="1600" height="2000" aria-hidden="true">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0 0 10 5 0 10z" class="edge-head"></path>
              </marker>
            </defs>
            <g id="edge-lines"></g>
          </svg>
          <div id="nodes" class="nodes"></div>
        </div>
        <aside id="member-panel" class="member-panel" aria-label="Pengaturan agent"></aside>
      </div>
      <div class="team-run">
        <form id="run-form" class="run-form">
          <input id="task" placeholder="Tugas untuk tim" aria-label="Tugas untuk tim">
          <button id="run" class="btn btn-primary" type="submit">Jalankan</button>
          <button id="cancel" class="btn btn-ghost hidden" type="button">Batalkan</button>
        </form>
        <div id="run-info" class="run-info"></div>
        <div id="result" class="prose result hidden"></div>
      </div>
    </section>
  </main>

  <aside id="inspector" class="inspector" aria-label="Sesi ini">
    <div class="inspector-head">
      <h2>Sesi ini</h2>
      <button id="close-inspector" class="icon-btn" aria-label="Tutup panel sesi" data-icon="x"></button>
    </div>
    <div id="stack" class="stack">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </aside>
</div>

<div id="scrim" class="scrim hidden"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="/static/js/marked.min.js"></script>
<script src="/static/js/purify.min.js"></script>
<script src="/static/js/highlight.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
